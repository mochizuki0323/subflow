<svg width="512" height="512" viewBox="0 0 512 512" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SubFlow</title>
  <desc>An amber plate with a scope trace and two caption lines cut out of it.</desc>

  <!-- The interface draws an active state as a solid accent plate with the content
       knocked out of it — the CAPTURING chip, the selected theme, the language
       switch. The mark is that figure at full size. No radius anywhere, because
       there is no radius anywhere in the interface either. -->
  <rect width="512" height="512" fill="#ffa724"/>

  <g fill="#0f1211">
    <!-- The scope: hard, thin ticks, as the monitor draws them. -->
    <rect x="104.0" y="140" width="28" height="70"/>
    <rect x="159.2" y="113" width="28" height="124"/>
    <rect x="214.4" y="149" width="28" height="52"/>
    <rect x="269.6" y="100" width="28" height="150"/>
    <rect x="324.8" y="127" width="28" height="96"/>
    <rect x="380.0" y="109" width="28" height="132"/>

    <!-- What it became: the transcript, and under it the translation. -->
    <rect x="104" y="301" width="304" height="42"/>
    <rect x="104" y="369" width="176" height="42"/>
  </g>
</svg>
